spring.application.name=backend
server.port=8080

spring.devtools.restart.enabled=true

# MySQL：请先建库 CREATE DATABASE dingli CHARACTER SET utf8mb4;
# 密码见 application-local.properties
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dingli?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# 查看留言列表时请求头 X-Admin-Key 需与此一致（生产请改掉）
app.admin-key=dingli-admin
